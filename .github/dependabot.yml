# Dependency scanning and update PRs (SECURITY-AND-SUPPLY-CHAIN-STANDARD).
# Runtime dependencies are stdlib-only; this watches the dev toolchain and the
# SHA-pinned GitHub Actions.
version: 2
updates:
  # `uv`, not `pip`. This project's dependency surface is a PEP 735 `[dependency-groups]`
  # block resolved into `uv.lock`; `[project] dependencies` is empty. The `pip` ecosystem
  # does not read `[dependency-groups]`, and a bump that did not also update `uv.lock`
  # would fail `make verify`, which opens with `uv lock --check`.
  #
  # The symptom was silence, not red PRs. Every dependabot pull request ever opened on this
  # repository - twelve of them, 2026-08-07 to 2026-08-27, on a weekly schedule - is
  # `github-actions`. Zero are `pip`, across a window in which pytest, mypy, ruff, pip-audit
  # and hypothesis all released. The dev toolchain the README calls "the whole dependency
  # surface" was unwatched, and nothing said so.
  #
  # `uv` is a documented `package-ecosystem` value: GitHub's Dependabot options reference
  # lists it, and version updates went generally available for it on 2025-03-13, security
  # updates on 2025-12-16. `uv.lock` is committed, which is what the ecosystem reads.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # `security.yml` pins github/codeql-action/init and github/codeql-action/analyze to
      # the same commit, and CodeQL refuses to run when the two disagree: "Loaded a
      # configuration file for version X, but running version Y". Dependabot treats the two
      # actions as separate dependencies, so ungrouped it opens one PR per action and each
      # one, in isolation, makes the versions disagree. Both PRs are then born red through
      # no fault of their own, and whichever merges first leaves `main` red until the other
      # follows. That happened on the 4.37.6 to 4.37.7 bump (#43 merged before #41) and
      # again on 4.37.7 to 4.37.8 (#51, #52).
      #
      # Grouping them means one PR moves both pins together, which is the only state CodeQL
      # accepts.
      codeql-action:
        patterns:
          - "github/codeql-action*"
