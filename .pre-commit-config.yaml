# Fast local gates run before a commit reaches CI. CI (`make verify` in
# .github/workflows/verify.yml) remains the gate of record; these hooks catch the
# same lint/hygiene/secret issues locally, before they leave your machine.
#
# Revisions are pinned to full commit SHAs (tag noted in a trailing comment),
# matching this repo's supply-chain pinning convention for GitHub Actions. Bump
# deliberately via a reviewed PR.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682 # v0.16.4 -- must equal the ruff uv.lock pins
    hooks:
      - id: ruff-check
        # Scoped to src/tests/action, mirroring `make lint`. `action/` is included
        # because it ships inside the composite Action. No --fix: a local pass must
        # mean the same thing as a CI pass.
        files: ^(src|tests|action)/
      - id: ruff-format
        # Mirrors `make format`. The CI gate is the --check form; this hook writes
        # the formatting so the commit that reaches CI is already the formatted one.
        files: ^(src|tests|action)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1 -- same version the security workflow pins
    hooks:
      - id: gitleaks

  # mypy strict needs this project's own venv to resolve imports, so call the
  # project's mypy rather than the isolated pre-commit mirror. Runs at pre-push:
  # a strict full-package check is too slow for the inner commit loop.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (src)
        entry: .venv/bin/python -m mypy
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
