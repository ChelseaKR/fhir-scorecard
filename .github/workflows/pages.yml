name: grade-and-publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *" # daily; one /metadata request per registry endpoint
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      contents: write # persists data/history.json so drift accrues across scheduled runs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Grade registry endpoints (live; unreachable endpoints grade F, never fail the build)
        run: python -m fhir_scorecard.cli grade --registry data/registry.json --out site
      - name: Persist drift history
        # [skip ci] keeps the history commit from retriggering this workflow in a loop.
        run: |
          if ! git diff --quiet data/history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: record capability drift observations [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: grade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
