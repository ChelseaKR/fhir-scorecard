name: Compliance report bundle

# The compliance-bundle tier's fulfillment step (docs/compliance-bundle-plan.md): render one
# buyer's branded evidence reports for a cohort of endpoints, zip them with a manifest, put the
# archive behind a 30-day capability link, and email the link. GitHub Actions is the on-demand
# compute, so the tier needs no always-on server.
#
# Dispatched by infra/compliance-bundle's post-checkout setup Lambda. It can also be dispatched
# by hand, on main, to re-run an order: the repair for an undelivered one is a re-run with the
# same order_ref. Payment is settled before dispatch; this workflow never talks to Stripe.
#
# NOTHING ABOUT THE BUYER IS AN INPUT. This repository is public, and GitHub prints each step's
# environment -- including any value that came from a workflow_dispatch input -- in a run log
# anyone can read. An earlier draft took the buyer's email address, organization name, endpoint
# list, and the bundle id (the download capability) as inputs, and would have published every
# one of them for every order. The only input now is `order_ref`: a random 128-bit name for an
# object the setup Lambda wrote to the private artifacts bucket. On its own it grants nothing;
# reading the object needs this workflow's AWS role, which trusts runs on main only. Every value
# read from the object is registered with ::add-mask:: before any later step can print it, so an
# error message that happens to quote an address is masked too.
#
# Renders from the already-published dataset, never re-probes. A bundle is packaging for the
# free site's own numbers, not a second measurement, so this fetches
# https://fhir.chelseakr.com/scorecards.json -- the same file a free visitor reads -- rather than
# re-grading, which would re-probe every payer's endpoint on every purchase and risk a report
# that disagrees with the free page for the same endpoint on the same day.

on:
  workflow_dispatch:
    inputs:
      order_ref:
        description: "32 lowercase hex characters naming a stored order; carries no buyer data"
        required: true
        type: string

permissions:
  contents: read

# Scoped per order rather than global: GitHub keeps only one pending run per concurrency group,
# so a shared group would let a third arrival evict a queued, paid order. Scoped to one order, an
# eviction can only ever drop a duplicate run of the same build. order_ref is safe to name here
# because it carries nothing.
concurrency:
  group: compliance-bundle-${{ inputs.order_ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # read the order and write the archive through AWS OIDC
    steps:
      # A paid order has nowhere to go without these three, so their absence fails the run
      # (and the run's failure is what tells the owner) rather than building an archive nobody
      # can reach.
      - name: Refuse to start without the delivery configuration
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          BUNDLE_API_BASE: ${{ vars.BUNDLE_API_BASE }}
          SES_FROM: ${{ vars.SES_FROM }}
          ORDER_REF: ${{ inputs.order_ref }}
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACTS_BUCKET}" ] || [ -z "${BUNDLE_API_BASE}" ] || [ -z "${SES_FROM}" ]; then
            echo "::error::ARTIFACTS_BUCKET, BUNDLE_API_BASE and SES_FROM must all be set as repository variables before an order can be fulfilled. See docs/compliance-bundle-owner-steps.md."
            exit 1
          fi
          if ! [[ "${ORDER_REF}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::order_ref must be 32 lowercase hex characters."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install the locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      # The object is read into request.json and every buyer-supplied value in it is masked
      # before anything else runs. The masking happens inside Python reading the file, so no
      # value ever appears in a step's rendered script or environment block.
      - name: Collect the order and mask what it holds
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          ORDER_REF: ${{ inputs.order_ref }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://${ARTIFACTS_BUCKET}/compliance-requests/${ORDER_REF}.json" request.json --only-show-errors
          uv run python -m fhir_scorecard.bundle_order mask request.json

      # The published dataset, fetched fresh rather than trusted from the checkout: the live
      # site is rebuilt daily on a schedule independent of commits (pages.yml), and a bundle
      # must render the numbers a buyer could see on fhir.chelseakr.com today. `curl -f` fails
      # the run on anything but a 2xx: a dataset that could not be read must never render as
      # "no scorecard is published" for an endpoint that has one.
      - name: Fetch the published dataset
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o scorecards.json https://fhir.chelseakr.com/scorecards.json

      - name: Render the bundle
        shell: bash
        run: |
          set -euo pipefail
          max_endpoints="$(uv run python -m fhir_scorecard.bundle_order cap request.json)"
          uv run fhir-scorecard bundle --request request.json \
            --registry data/registry.json --scorecards scorecards.json \
            --max-endpoints "${max_endpoints}" \
            --out bundle.zip --plan-out manifest.json
          included="$(jq '.included' manifest.json)"
          requested="$(jq '.requested' manifest.json)"
          {
            echo "## Compliance report bundle"
            echo
            echo "${included} of ${requested} requested endpoints included; the manifest says"
            echo "what happened to the rest. Nothing identifying the order is shown on this page."
          } >> "$GITHUB_STEP_SUMMARY"

      # compliance-bundles/ expires after 30 days (main.tf's lifecycle rule). The only way to it
      # is the download route in infra/compliance-bundle, which presigns per click.
      - name: Upload the archive behind its capability key
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          key="$(uv run python -m fhir_scorecard.bundle_order archive-key request.json)"
          aws s3 cp bundle.zip "s3://${ARTIFACTS_BUCKET}/${key}" \
            --content-type application/zip --only-show-errors

      - name: Email the download link
        shell: bash
        env:
          BUNDLE_API_BASE: ${{ vars.BUNDLE_API_BASE }}
          SES_FROM: ${{ vars.SES_FROM }}
        run: |
          set -euo pipefail
          uv run --with boto3 python -m fhir_scorecard.bundle_order email request.json manifest.json

      # What this may NOT do is name the order: the bundle id is the download credential, and
      # annotations and run summaries are public on a public repository. This says only that an
      # order failed and how to repair it.
      - name: Say that a paid order failed
        if: ${{ failure() }}
        shell: bash
        env:
          ORDER_REF: ${{ inputs.order_ref }}
        run: |
          set -euo pipefail
          echo "::error::A paid compliance report bundle did not complete. The buyer was told the build had started and nothing else will tell them otherwise. Re-running this workflow on main with the same order_ref is the repair."
          {
            echo
            echo "## A paid order was not delivered"
            echo
            echo "- order_ref: \`${ORDER_REF}\` (names the stored order; carries no buyer data)"
            echo
            echo "Re-running this workflow with the same order_ref is safe: the archive and the"
            echo "download link are both keyed on the bundle id inside the stored order, so a"
            echo "re-run fills the object the buyer's existing link already points at."
          } >> "$GITHUB_STEP_SUMMARY"

      # Deliberately no upload-artifact step. A run artifact of this repository is published:
      # every signed-in GitHub account can download it for its whole retention window. bundle.zip
      # is the paid deliverable and manifest.json and request.json carry the download capability
      # and the buyer's address.
