name: grade-and-publish

# Probing runs from several vantages and the results are reconciled, because a single network is
# an unreliable narrator: on 2026-08-05 a live payer endpoint was recorded as dead because a
# middlebox on the probing network intercepted TLS. Reaching an endpoint from anywhere settles
# that it is up; failing from one place settles nothing.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *" # daily; one /metadata request per registry endpoint per vantage
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false # losing one vantage should degrade the consensus, not the run
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Probe from this vantage
        run: >
          python -m fhir_scorecard.cli grade
          --registry data/registry.json
          --out probe-site
          --history probe-history.json
          --probes-out probes-${{ matrix.os }}.json
          --vantage "github-actions/${{ matrix.os }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probes-${{ matrix.os }}
          path: probes-${{ matrix.os }}.json
          retention-days: 7

  grade:
    needs: probe
    if: always() # publish from whatever vantages did report
    runs-on: ubuntu-latest
    permissions:
      contents: write # persists data/history.json so availability accrues across runs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: probes-*
          path: probes
          merge-multiple: true
      - name: List reporting vantages
        run: ls -la probes/ || echo "no peer vantages reported; grading from this run alone"
      - name: Grade and reconcile across vantages
        shell: bash
        run: |
          shopt -s nullglob
          peers=(probes/*.json)
          python -m fhir_scorecard.cli grade \
            --registry data/registry.json \
            --out site \
            --origin "https://chelseakr.github.io/fhir-scorecard" \
            --vantage "github-actions/ubuntu-latest" \
            ${peers:+--probes-in "${peers[@]}"}
      - name: Persist drift and availability history
        # [skip ci] keeps the history commit from retriggering this workflow in a loop.
        run: |
          if ! git diff --quiet data/history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: record capability drift observations [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: grade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
