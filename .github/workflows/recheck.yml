name: recheck-rejected

# Rejections go stale: payers stand up endpoints, migrate hosts, and lift gateway rules. A
# candidate log that is never revisited quietly becomes wrong, so re-probe on a schedule and
# raise an issue when something starts answering. Promotion into the registry stays manual,
# because verification means confirming the publisher is who the entry claims.
on:
  schedule:
    - cron: "23 15 1 */3 *" # 15:23 UTC on the 1st, every third month
  workflow_dispatch:

permissions: {}

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job opens an issue with GH_TOKEN; it never pushes
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: 'pip'
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install
        # `uv sync --locked`, not `pip install -e .`. The pip form resolved hatchling and its
        # transitive build dependencies from PyPI at build time - unpinned, unhashed, and never
        # seen by `make audit`, which scans the locked set. This job holds a write token and
        # parses documents fetched from 45 third-party servers, and it is the job that produces
        # the citable dataset, so it installs exactly what the lockfile pins like every other
        # job that matters. `--no-dev` because nothing here runs the linters or the test suite.
        run: uv sync --locked --no-dev
      - name: Re-probe rejected candidates
        id: recheck
        # `set -euo pipefail` is load-bearing here, not boilerplate. The default shell is
        # `bash -e`, which does not set pipefail, so the exit status of
        # `recheck ... | tee report.txt` is tee's and is always 0. Without pipefail a crashed
        # or aborted re-probe left a truncated report.txt, `grep -q` found no "NOW ANSWERS"
        # in it, this step set revived=false, and the workflow went green having checked
        # nothing. `recheck` exits 2 when it cannot load data/rejected.json, and that 2 was
        # discarded too: a malformed candidate file would have reported "no revivals" every
        # quarter, forever, which is the exact rot this workflow exists to prevent.
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m fhir_scorecard.cli recheck \
            --candidates data/rejected.json \
            --json-out recheck.json | tee report.txt
          # Branch on the structured result, never on the report. This used to
          # `grep -q "NOW ANSWERS" report.txt`, and that string is assembled from a
          # third-party server's `software.name`: a payer publishing a name containing
          # the marker forced a false revival issue in this repository. What a payer
          # publishes is evidence, and evidence does not get to steer control flow.
          revived="$(uv run python -c 'import json;print("true" if json.load(open("recheck.json"))["revived"] else "false")')"
          echo "revived=$revived" >> "$GITHUB_OUTPUT"
      - name: Open an issue when a candidate revives
        if: steps.recheck.outputs.revived == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "A previously rejected endpoint now answers. It is **not** in the registry yet:"
            echo "confirm the publisher matches the claimed organization before adding it."
            echo
            echo '```'
            cat report.txt
            echo '```'
          } > body.md
          gh issue create \
            --title "Rejected candidate now answering ($(date -u +%Y-%m-%d))" \
            --body-file body.md \
            --repo "$GITHUB_REPOSITORY"
