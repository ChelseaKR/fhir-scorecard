name: security

# SAST, secret scanning and dependency auditing, armed with automatic triggers
# (push/PR/schedule) so the controls actually run rather than existing on paper. The weekly
# schedule matters for all three: it re-analyzes main with newly published query packs,
# re-scans the full git history, and catches advisories published after the last code change,
# which is how a dependency set that was clean on merge stops being clean.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1" # Mondays, 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `python` analyzes the application code; `actions` analyzes the workflow
        # YAML itself for injection/permissions/dangerous-trigger issues.
        include:
          - language: python
            queries: security-and-quality
          - language: actions
            queries: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: ${{ matrix.queries }}
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependency-audit:
    name: Dependency audit (pip-audit over uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.1"
      - name: Audit the locked dependency set
        # The same target `make verify` runs, so the merge gate and the weekly sweep cannot
        # disagree about what was audited. It exports the locked set (dropping the local
        # project, which is not on PyPI) and runs pip-audit --strict over it: an advisory
        # fails, and so does a dependency that could not be audited at all.
        shell: bash
        run: |
          set -euo pipefail
          make sync
          make audit

  gitleaks:
    name: full-history secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        # Run the pinned gitleaks binary directly instead of a third-party action:
        # a checksum-verified, version-pinned binary is a deterministic supply-chain
        # pin. `gitleaks git` with a full-depth checkout walks the entire history.
        shell: bash
        run: |
          # pipefail so the checksum pipeline below cannot pass on a grep that matched
          # nothing. The default shell is `bash -e`, which does not set it.
          set -euo pipefail
          GL=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL}"
          ARCHIVE="gitleaks_${GL}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL -o /tmp/gitleaks_checksums.txt "${BASE}/gitleaks_${GL}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1
