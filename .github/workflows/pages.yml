name: grade-and-publish

# Probing runs from three vantages and the results are reconciled, because a single network is
# an unreliable narrator: on 2026-08-05 a live payer endpoint was recorded as dead because a
# middlebox on the probing network intercepted TLS. Reaching an endpoint from anywhere settles
# that it is up; failing from one place settles nothing.
#
# What the three vantages are, precisely: ubuntu-latest, macos-latest and windows-latest, all
# GitHub-hosted runners. They are three hosts on one provider's network, not three networks.
# They catch a fault local to one host or one TLS trust store; they cannot catch a source-address
# rule, bot filter, geo rule or rate limit applied to that provider's address space, because such
# a rule hits all three at once. The published sentences say "one network" wherever that is what
# happened, and an all-vantage failure is reported as not reached from here rather than as an
# endpoint being down.
#
# Triggered on a schedule and on demand, not on push: what the site says is a function of the
# endpoints, not of a commit, and a push-triggered probe sweep multiplied a working day's
# requests to every registry endpoint by more than an order of magnitude (14 pushes on
# 2026-08-05). Merging a change reaches the site at the next scheduled run, or immediately via
# workflow_dispatch.
on:
  schedule:
    - cron: "17 14 * * *" # daily; two requests per registry endpoint per probing vantage
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false # losing one vantage should degrade the consensus, not the run
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job only reads; it never pushes
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Probe from this vantage
        run: >
          python -m fhir_scorecard.cli grade
          --registry data/registry.json
          --out probe-site
          --history probe-history.json
          --probes-out probes-${{ matrix.os }}.json
          --vantage "github-actions/${{ matrix.os }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probes-${{ matrix.os }}
          path: probes-${{ matrix.os }}.json
          retention-days: 7

  grade:
    needs: probe
    if: always() # publish from whatever vantages did report
    runs-on: ubuntu-latest
    permissions:
      contents: write # persists data/history.json so availability accrues across runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Kept on deliberately: the history step below pushes to the
          # capability-history branch with this token. Narrowed by the job's
          # contents: write being the only write scope it holds.
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: probes-*
          path: probes
          merge-multiple: true
      - name: List reporting vantages
        run: ls -la probes/ || echo "no peer vantages reported; grading from this run alone"
      - name: Restore capability history from its own branch
        # Availability and drift only mean something against what was seen before, so
        # this must be the real prior state or not run at all. If the branch exists and
        # cannot be read, fail: grading from a stale seed would report drift that did
        # not happen and reset availability streaks to zero.
        env:
          HISTORY_BRANCH: capability-history
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$HISTORY_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$HISTORY_BRANCH"
            git show "FETCH_HEAD:history.json" > data/history.json
            echo "restored history for $(python -c 'import json;from fhir_scorecard.drift import endpoint_count;print(endpoint_count(json.load(open("data/history.json"))))') endpoints from $HISTORY_BRANCH"
          else
            echo "::notice title=seeding history::$HISTORY_BRANCH does not exist yet; this run seeds it from the copy committed on main"
          fi
      - name: Grade and reconcile across vantages
        # This job used to make its own live probe under "github-actions/ubuntu-latest", the
        # same label the ubuntu probe artifact already carried, and reconcile() did not dedupe:
        # every card published "reachable from all 4 vantage(s)" when three vantages had
        # reported, and ubuntu's latency counted twice in the median. It also spent a fourth
        # request on every endpoint to learn nothing the artifacts did not already hold. With
        # --from-probes it grades the documents the probing runs retrieved and makes no request
        # of its own. Falling back to a live probe only if no vantage reported at all, so a
        # failed matrix degrades the consensus rather than publishing a registry of failures.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          peers=(probes/*.json)
          if [ ${#peers[@]} -gt 0 ]; then
            python -m fhir_scorecard.cli grade \
              --registry data/registry.json \
              --out site \
              --origin "https://chelseakr.github.io/fhir-scorecard" \
              --from-probes \
              --probes-in "${peers[@]}"
          else
            echo "::warning title=no vantages reported::no probe artifact was produced; grading from this run's own single probe"
            python -m fhir_scorecard.cli grade \
              --registry data/registry.json \
              --out site \
              --origin "https://chelseakr.github.io/fhir-scorecard" \
              --vantage "github-actions/ubuntu-latest"
          fi
      - name: Persist drift and availability history
        # History is data this run observed, not source, and it lives on a branch of
        # its own. It used to be pushed straight to main, which could never work: main
        # carries a ruleset requiring the "verify" check, and a check cannot run on a
        # commit that has not landed, so every daily run died here with GH013 and the
        # deploy that follows was skipped. Keeping it off main also stops a bot commit
        # a day accruing on the default branch.
        #
        # Written with plumbing rather than checkout or worktree on purpose: the
        # working tree still holds the freshly rendered `site` that the next step
        # uploads, and no history bookkeeping is allowed to disturb it.
        env:
          HISTORY_BRANCH: capability-history
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          blob="$(git hash-object -w data/history.json)"
          parent=""
          if git ls-remote --exit-code --heads origin "$HISTORY_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$HISTORY_BRANCH"
            parent="$(git rev-parse FETCH_HEAD)"
            # -q --verify so a branch that somehow lacks the file records a fresh
            # observation instead of wedging the publish behind a manual fix.
            previous="$(git rev-parse -q --verify "FETCH_HEAD:history.json" || true)"
            if [ "$previous" = "$blob" ]; then
              echo "no capability drift or availability change to record"
              exit 0
            fi
          fi
          tree="$(printf '100644 blob %s\thistory.json\n' "$blob" | git mktree)"
          message="chore: record capability drift observations ($(date -u +%F))"
          if [ -n "$parent" ]; then
            commit="$(git commit-tree "$tree" -p "$parent" -m "$message")"
          else
            commit="$(git commit-tree "$tree" -m "$message")"
          fi
          git push origin "$commit:refs/heads/$HISTORY_BRANCH"
          echo "recorded history on $HISTORY_BRANCH at $commit"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: grade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
