name: scorecard

# OpenSSF Scorecard: a supply-chain posture score (Pinned-Dependencies, Token-Permissions,
# Branch-Protection, Dangerous-Workflow, SAST, Vulnerabilities and the rest) computed on every
# push to main and weekly. The SARIF lands in the code-scanning tab next to CodeQL, and
# `publish_results` sends the run to the public Scorecard API that the README badge reads.
#
# `publish_results: true` restricts this file: no workflow-level `env` or `defaults`, no
# containers or services, and only allowlisted actions with no `run` steps. Scorecard's API
# rejects a result from a workflow that breaks those rules, so keep anything else out of it.
#
# The SARIF carries only checks scoring below 10 and has no aggregate field. For a score table
# read the badge's API (https://api.scorecard.dev/projects/github.com/ChelseaKR/fhir-scorecard)
# or run `scorecard --repo=github.com/ChelseaKR/fhir-scorecard` locally.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 2" # Tuesdays, 06:17 UTC
  workflow_dispatch:

permissions: read-all

# One group per commit on main, so a second push cannot cancel the first commit's run.
concurrency:
  group: scorecard-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Job-level permissions replace the workflow-level block, so `contents: read` is repeated.
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # OIDC token publish_results needs to sign the result
      # Read scopes Scorecard's GraphQL queries use for the SAST and CI-Tests checks.
      issues: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
