name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CI-CD-STANDARD.md 11c: cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install the locked toolchain
        # `make sync` runs `uv sync --locked`: install exactly what uv.lock pins, and refuse
        # if the lock has drifted from pyproject.toml. The previous `pip install -e '.[dev]'`
        # re-resolved from PyPI on every run, so the committed lockfile described a toolchain
        # nothing used and could go stale indefinitely without anything noticing.
        # `--frozen` would not have fixed that: it installs a drifted lock and exits 0.
        # `make verify` re-checks the lock as its first gate, before anything can repair it.
        run: make sync
      - name: Verify (lock, lint, format, strict typecheck, tests + coverage floor, audit)
        run: make verify
