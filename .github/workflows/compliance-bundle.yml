name: Compliance report bundle

# The compliance-bundle tier's fulfilment step (docs/compliance-bundle-plan.md): render one
# buyer's branded evidence reports for a cohort of endpoints, zip them with a manifest, put the
# archive behind a 30-day capability link, and email the link. GitHub Actions is the on-demand
# compute, so the tier needs no always-on server.
#
# Dispatched by infra/compliance-bundle's post-checkout setup Lambda. It can also be dispatched
# by hand for a test-mode run or a make-good. Payment is settled before dispatch; this workflow
# never talks to Stripe.
#
# Every input is untrusted. Inputs reach the pipeline through environment variables and a JSON
# file written by Python, never interpolated into a shell command, and fhir_scorecard.bundle's
# parse_request validates all of them (id pattern, cohort cap, accent, email, logo shape) before
# anything is rendered.
#
# Renders from the already-published dataset, never re-probes. This project's central ethic
# (grading.py: "no invented claim") extends to the paid path: a bundle is packaging for the free
# site's own numbers, not a second measurement. So this workflow fetches
# https://fhir.chelseakr.com/scorecards.json -- the same file a free visitor reads -- rather than
# calling `fhir-scorecard grade` again for a paying buyer, which would both re-probe every
# payer's endpoint on every purchase and risk a report that disagrees with the free page for the
# same endpoint on the same day.

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "32 lowercase hex characters; the download capability"
        required: true
        type: string
      program_name:
        description: "Goes on every report cover (120 characters max)"
        required: true
        type: string
      accent:
        description: "#rrggbb accent for the cover band and rules"
        required: false
        default: ""
        type: string
      logo:
        description: "https URL or SVG/PNG/JPEG data: URI, optional"
        required: false
        default: ""
        type: string
      endpoint_ids:
        description: "Comma-separated registry ids, up to 70"
        required: true
        type: string
      deliver_to:
        description: "Email address the download link goes to"
        required: true
        type: string
      cadence:
        description: "one_time or quarterly (changes the email's wording only)"
        required: false
        default: "one_time"
        type: choice
        options: [one_time, quarterly]
      dispatch_key:
        description: "sha256(bundle_id) truncated; groups this bundle's runs without naming it"
        required: false
        default: ""
        type: string
      promised_by:
        description: "The delivery date this order was committed to, as the buyer was told it"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# `bundle_id` is the download capability, and this repository is public. It must not appear in
# any string GitHub may render on a run page -- that rules it out here and in any artifact name
# -- so the dispatcher supplies `dispatch_key` (sha256 of the bundle id, truncated) instead.
#
# Scoped per bundle rather than global, for the reason gtfs-scorecard's report-bundle.yml
# documents: GitHub keeps only one pending run per concurrency group, so a shared group risks a
# third arrival evicting a queued, paid order. Scoped to one bundle, an eviction can only ever
# drop a duplicate run of the same build.
concurrency:
  group: compliance-bundle-${{ inputs.dispatch_key || github.run_id }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # read/write the artifacts bucket through AWS OIDC, once configured
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked

      - name: Write and validate the request
        shell: bash
        env:
          IN_BUNDLE_ID: ${{ inputs.bundle_id }}
          IN_PROGRAM_NAME: ${{ inputs.program_name }}
          IN_ACCENT: ${{ inputs.accent }}
          IN_LOGO: ${{ inputs.logo }}
          IN_ENDPOINT_IDS: ${{ inputs.endpoint_ids }}
          IN_DELIVER_TO: ${{ inputs.deliver_to }}
          IN_CADENCE: ${{ inputs.cadence }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, os
          keys = ("bundle_id", "program_name", "accent", "logo", "endpoint_ids", "deliver_to", "cadence")
          request = {k: os.environ.get(f"IN_{k.upper()}", "") for k in keys}
          with open("request.json", "w") as fh:
              json.dump(request, fh)
          PY

      # The published dataset, fetched fresh rather than trusted from the checkout: the checkout
      # is whatever commit this workflow happened to run at, and the live site is rebuilt daily
      # on a schedule independent of commits (pages.yml). A bundle must render the numbers a
      # buyer could see on fhir.chelseakr.com today, not the numbers current when this ref last
      # changed.
      - name: Fetch the published dataset
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o scorecards.json https://fhir.chelseakr.com/scorecards.json

      - name: Render the bundle
        shell: bash
        run: |
          set -euo pipefail
          uv run fhir-scorecard bundle --request request.json \
            --registry data/registry.json --scorecards scorecards.json \
            --out bundle.zip --plan-out manifest.json
          {
            echo "## Compliance report bundle"
            echo
            echo "$(jq '.included' manifest.json) of $(jq '.requested' manifest.json) requested"
            echo "endpoints included; see the manifest for what happened to the rest."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to AWS
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Upload the archive behind its capability key
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          # compliance-bundles/ is outside any CDN allow-list and expires after 30 days (an S3
          # lifecycle rule, once infra/artifacts exists for this repo). The only way to it is
          # the download route in infra/compliance-bundle, which presigns per click.
          aws s3 cp bundle.zip "s3://${ARTIFACTS_BUCKET}/compliance-bundles/${BUNDLE_ID}/bundle.zip" \
            --content-type application/zip --only-show-errors

      # Once the step above has run, the archive is in the bucket and the buyer's only route to
      # it is this email. Both variables are checked *inside* this step rather than in its `if:`
      # for the reason gtfs-scorecard's report-bundle.yml documents: a blank BUNDLE_API_BASE or
      # SES_FROM must not let the run end green with the archive sitting in S3 and no way to it.
      - name: Email the download link
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        shell: bash
        env:
          BUNDLE_API_BASE: ${{ vars.BUNDLE_API_BASE }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          PROMISED_BY: ${{ inputs.promised_by }}
          SES_FROM: ${{ vars.SES_FROM }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE_API_BASE}" ] || [ -z "${SES_FROM}" ]; then
            echo "::error::The archive was uploaded but the delivery route is not configured (BUNDLE_API_BASE and SES_FROM must both be set), so the download link cannot be sent. Failing this run: an uploaded archive with no email reads as a delivered order everywhere else in this system."
            exit 1
          fi
          expires="$(date -u -d '+30 days' +%Y-%m-%d)"
          uv run --with boto3 python - <<PY
          import json, os
          from fhir_scorecard.bundle import BundleRequest, delivery_email

          with open("request.json") as fh:
              raw = json.load(fh)
          with open("manifest.json") as fh:
              manifest = json.load(fh)
          # delivery_email reads program_name, cadence, and deliver_to from the request, and the
          # per-endpoint outcome from manifest.json; endpoint_ids is unused here, so an empty
          # tuple satisfies the dataclass without re-parsing the comma-separated input again.
          request = BundleRequest(
              bundle_id=raw["bundle_id"], program_name=raw["program_name"],
              accent=raw.get("accent") or "#162e51", logo=raw.get("logo") or None,
              endpoint_ids=(), deliver_to=raw["deliver_to"], cadence=raw.get("cadence") or "one_time",
          )
          email = delivery_email(
              request, manifest,
              download_url=f"{os.environ['BUNDLE_API_BASE'].rstrip('/')}/download/{os.environ['BUNDLE_ID']}",
              expires_on="$expires",
              promised_by=os.environ.get("PROMISED_BY", ""),
          )
          import boto3
          ses = boto3.client("ses", region_name=os.environ.get("AWS_REGION", "us-west-2"))
          ses.send_email(
              Source=os.environ["SES_FROM"],
              Destination={"ToAddresses": [email.to]},
              Message={"Subject": {"Data": email.subject}, "Body": {"Text": {"Data": email.body}}},
          )
          PY

      - name: Say when delivery is off
        if: ${{ vars.ARTIFACTS_BUCKET == '' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "**No email was sent.** ARTIFACTS_BUCKET, BUNDLE_API_BASE, and SES_FROM must all be"
            echo "set for delivery. The archive is not attached to this run either: a run artifact"
            echo "of a public repository is published, and this one is a paid deliverable that"
            echo "carries its own download capability. Set the three variables and re-run this"
            echo "workflow with the same inputs. See docs/compliance-bundle-plan.md."
          } >> "$GITHUB_STEP_SUMMARY"

      # What this may NOT do is name the order: the bundle id is the download credential and
      # annotations and run summaries are public on a public repository. This says only that an
      # order failed, and points at the private places that would name it, mirroring the lesson
      # gtfs-scorecard's report-bundle.yml records finding the hard way.
      - name: Say that a paid order failed
        if: ${{ failure() }}
        shell: bash
        env:
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: |
          set -euo pipefail
          echo "::error::A paid compliance report bundle did not complete. The buyer was told the build had started and nothing else will tell them otherwise. Re-running this workflow with the same inputs is the repair."
          {
            echo
            echo "## A paid order was not delivered"
            echo
            echo "- run group: \`${DISPATCH_KEY:-none}\`"
            echo
            echo "Re-running this workflow with the same inputs is safe: the archive and the"
            echo "download link are both keyed on the bundle id, so a re-run fills the object the"
            echo "buyer's existing link already points at. The inputs are not shown on this page."
          } >> "$GITHUB_STEP_SUMMARY"

      # Deliberately no upload-artifact step. A run artifact of this repository is published:
      # this repo is public, so every signed-in GitHub account can download it for its whole
      # retention window. bundle.zip is the paid deliverable and manifest.json's bundle_id is
      # the download capability -- uploading either as a run artifact would publish a working
      # credential. Delivery goes through compliance-bundles/<id>/bundle.zip in the artifacts
      # bucket instead, reachable only through the presigning download route.
