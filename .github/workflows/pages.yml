name: grade-and-publish

# Probing runs from several vantages and the results are reconciled, because a single network is
# an unreliable narrator: on 2026-08-05 a live payer endpoint was recorded as dead because a
# middlebox on the probing network intercepted TLS. Reaching an endpoint from anywhere settles
# that it is up; failing from one place settles nothing.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *" # daily; one /metadata request per registry endpoint per vantage
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false # losing one vantage should degrade the consensus, not the run
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # this job only reads; it never pushes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Probe from this vantage
        run: >
          python -m fhir_scorecard.cli grade
          --registry data/registry.json
          --out probe-site
          --history probe-history.json
          --probes-out probes-${{ matrix.os }}.json
          --vantage "github-actions/${{ matrix.os }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probes-${{ matrix.os }}
          path: probes-${{ matrix.os }}.json
          retention-days: 7

  grade:
    needs: probe
    if: always() # publish from whatever vantages did report
    runs-on: ubuntu-latest
    permissions:
      contents: write # persists data/history.json so availability accrues across runs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Kept on deliberately: the history step below pushes to the
          # capability-history branch with this token. Narrowed by the job's
          # contents: write being the only write scope it holds.
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: probes-*
          path: probes
          merge-multiple: true
      - name: List reporting vantages
        run: ls -la probes/ || echo "no peer vantages reported; grading from this run alone"
      - name: Restore capability history from its own branch
        # Availability and drift only mean something against what was seen before, so
        # this must be the real prior state or not run at all. If the branch exists and
        # cannot be read, fail: grading from a stale seed would report drift that did
        # not happen and reset availability streaks to zero.
        env:
          HISTORY_BRANCH: capability-history
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$HISTORY_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$HISTORY_BRANCH"
            git show "FETCH_HEAD:history.json" > data/history.json
            echo "restored history for $(python -c 'import json,sys;print(len(json.load(open("data/history.json"))))') endpoints from $HISTORY_BRANCH"
          else
            echo "::notice title=seeding history::$HISTORY_BRANCH does not exist yet; this run seeds it from the copy committed on main"
          fi
      - name: Grade and reconcile across vantages
        shell: bash
        run: |
          shopt -s nullglob
          peers=(probes/*.json)
          python -m fhir_scorecard.cli grade \
            --registry data/registry.json \
            --out site \
            --origin "https://chelseakr.github.io/fhir-scorecard" \
            --vantage "github-actions/ubuntu-latest" \
            ${peers:+--probes-in "${peers[@]}"}
      - name: Persist drift and availability history
        # History is data this run observed, not source, and it lives on a branch of
        # its own. It used to be pushed straight to main, which could never work: main
        # carries a ruleset requiring the "verify" check, and a check cannot run on a
        # commit that has not landed, so every daily run died here with GH013 and the
        # deploy that follows was skipped. Keeping it off main also stops a bot commit
        # a day accruing on the default branch.
        #
        # Written with plumbing rather than checkout or worktree on purpose: the
        # working tree still holds the freshly rendered `site` that the next step
        # uploads, and no history bookkeeping is allowed to disturb it.
        env:
          HISTORY_BRANCH: capability-history
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          blob="$(git hash-object -w data/history.json)"
          parent=""
          if git ls-remote --exit-code --heads origin "$HISTORY_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$HISTORY_BRANCH"
            parent="$(git rev-parse FETCH_HEAD)"
            # -q --verify so a branch that somehow lacks the file records a fresh
            # observation instead of wedging the publish behind a manual fix.
            previous="$(git rev-parse -q --verify "FETCH_HEAD:history.json" || true)"
            if [ "$previous" = "$blob" ]; then
              echo "no capability drift or availability change to record"
              exit 0
            fi
          fi
          tree="$(printf '100644 blob %s\thistory.json\n' "$blob" | git mktree)"
          message="chore: record capability drift observations ($(date -u +%F))"
          if [ -n "$parent" ]; then
            commit="$(git commit-tree "$tree" -p "$parent" -m "$message")"
          else
            commit="$(git commit-tree "$tree" -m "$message")"
          fi
          git push origin "$commit:refs/heads/$HISTORY_BRANCH"
          echo "recorded history on $HISTORY_BRANCH at $commit"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: grade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
